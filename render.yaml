# Render Blueprint for the hosted DummyRun demo.
# Secrets are set in the Render dashboard (sync: false), never in this file.
services:
  - type: web
    name: dummyrun
    runtime: docker
    plan: standard # Chromium for the AI test shoppers needs about 2 GB of memory
    healthCheckPath: /healthz
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: MAX_PARALLEL
        value: "2"
      - key: DAILY_CRASH_TESTS
        value: "30"
      - key: DAILY_FIXES
        value: "15"
      - key: DAILY_AI_REQUESTS
        value: "1500"
    # Crash-test history, recordings and patched stores survive deploys.
    disk:
      name: runs
      mountPath: /app/runs
      sizeGB: 2
